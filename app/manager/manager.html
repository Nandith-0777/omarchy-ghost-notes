<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Ghost Notes</title>
    <link rel="stylesheet" href="manager.css" />
  </head>

  <body>
    <div class="app" id="app">
      <aside class="sidebar" id="sidebar" aria-label="Workspaces">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 64 64">
              <rect width="64" height="64" rx="14" fill="#5b4bff" />
              <path
                d="M32 12c-9.4 0-17 7.6-17 17v19.5c0 1.3 1.5 2 2.5 1.1l4-3.6 4.2 3.8c.9.8 2.3.8 3.2 0l3.1-2.8 3.1 2.8c.9.8 2.3.8 3.2 0l4.2-3.8 4-3.6c1-.9 2.5-.2 2.5 1.1V29c0-9.4-7.6-17-17-17z"
                fill="#ffffff"
              />
              <circle cx="26" cy="28" r="3.4" fill="#5b4bff" />
              <circle cx="38" cy="28" r="3.4" fill="#5b4bff" />
            </svg>
          </span>
          Ghost Notes
          <span class="brand-spacer"></span>
          <button
            class="icon-btn"
            id="sidebarClose"
            title="Hide sidebar"
            aria-label="Hide sidebar"
          >
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3" y="4" width="18" height="16" rx="2" />
              <path d="M9 4v16" />
            </svg>
          </button>
        </div>
        <div class="nav-label">Workspaces</div>
        <nav class="ws-nav" id="workspaceNav"></nav>
        <button type="button" class="ws-new" id="wsNew">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
          New workspace
        </button>
        <div class="sidebar-foot">
          <button type="button" class="side-link" id="settingsBtn">
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
              />
            </svg>
            Settings
          </button>
          <button type="button" class="side-link" id="helpBtn">
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="10" />
              <path d="M9.1 9a3 3 0 015.8 1c0 2-3 3-3 3" />
              <line x1="12" y1="17" x2="12.01" y2="17" />
            </svg>
            Help &amp; Feedback
          </button>
        </div>
      </aside>

      <div class="main" id="main">
        <header class="page-head">
          <div class="page-head-left">
            <button
              class="icon-btn ghost-btn"
              id="sidebarOpen"
              title="Show sidebar"
              aria-label="Show sidebar"
            >
              <svg
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect x="3" y="4" width="18" height="16" rx="2" />
                <path d="M9 4v16" />
              </svg>
            </button>
            <div class="page-titles">
              <div class="page-kicker">YOUR SPACE TO THINK</div>
              <h1 id="pageTitle">Notes</h1>
              <p class="page-sub" id="pageSub"></p>
              <button
                type="button"
                class="ws-chip"
                id="wsChip"
                aria-haspopup="menu"
                aria-expanded="false"
              >
                <span class="chip-dot" id="wsChipDot" aria-hidden="true"></span>
                <span id="wsChipLabel"></span>
                <svg
                  class="chev"
                  width="12"
                  height="12"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <polyline points="6 9 12 15 18 9" />
                </svg>
              </button>
            </div>
          </div>
          <div class="page-head-actions">
            <button class="btn" id="newNote">
              <svg
                width="12"
                height="12"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.6"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
              New note
            </button>
            <button
              class="icon-btn ghost-btn"
              id="moreBtn"
              title="Workspace actions"
              aria-label="Workspace actions"
              aria-haspopup="menu"
              aria-expanded="false"
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="currentColor"
                aria-hidden="true"
              >
                <circle cx="6" cy="12" r="1.7" />
                <circle cx="12" cy="12" r="1.7" />
                <circle cx="18" cy="12" r="1.7" />
              </svg>
            </button>
          </div>
        </header>

        <div class="search-row">
          <div class="search-wrap">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="7" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input
              id="search"
              type="text"
              placeholder="Search your notes…"
              aria-label="Search notes"
            />
            <span class="search-hint" id="searchHint">⌘K</span>
          </div>
        </div>

        <div class="collection-toolbar">
          <div class="note-filters" role="group" aria-label="Filter notes">
            <button type="button" data-filter="all" aria-pressed="true">
              All notes <span id="allCount">0</span>
            </button>
            <button type="button" data-filter="open" aria-pressed="false">
              On desktop <span id="openCount">0</span>
            </button>
            <button type="button" data-filter="hidden" aria-pressed="false">
              Hidden <span id="hiddenCount">0</span>
            </button>
          </div>
          <span class="collection-order">Recently edited</span>
        </div>
        <div class="list" id="list" aria-label="Notes"></div>
      </div>
    </div>

    <div id="status" role="status"></div>

    <div
      class="popover"
      id="moreMenu"
      hidden
      role="menu"
      aria-label="Workspace actions"
    ></div>
    <div
      class="popover"
      id="wsMenu"
      hidden
      role="menu"
      aria-label="Workspaces"
    ></div>
    <div
      class="popover"
      id="noteMenu"
      hidden
      role="menu"
      aria-label="Note actions"
    ></div>

    <dialog
      class="modal"
      id="deleteDialog"
      aria-labelledby="deleteTitle"
      aria-describedby="deleteDescription"
    >
      <div class="dialog-icon danger-icon" aria-hidden="true">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 6h18M9 6V4h6v2M5 6l1 14h12l1-14M10 10v6M14 10v6" />
        </svg>
      </div>
      <h2 id="deleteTitle">Delete this note permanently?</h2>
      <p id="deleteDescription">
        This cannot be undone. The note will be removed from this device.
      </p>
      <form method="dialog" class="modal-actions">
        <button class="btn btn-quiet" value="cancel" autofocus>Cancel</button>
        <button class="btn btn-danger" id="deleteConfirm" value="delete">
          Delete note
        </button>
      </form>
    </dialog>

    <dialog
      class="modal workspace-dialog"
      id="wsModal"
      aria-labelledby="wsModalTitle"
      aria-describedby="wsModalDescription"
    >
      <form id="wsForm">
        <div class="dialog-icon" aria-hidden="true">＋</div>
        <h2 id="wsModalTitle">New workspace</h2>
        <p id="wsModalDescription">Give your ideas a place of their own.</p>
        <label class="input-label" for="wsNameInput">Workspace name</label>
        <input
          id="wsNameInput"
          type="text"
          maxlength="40"
          placeholder="Workspace name…"
          autocomplete="off"
          required
        />
        <div class="modal-actions">
          <button type="button" class="btn btn-quiet" id="wsCancel">
            Cancel
          </button>
          <button type="submit" class="btn" id="wsSave">Save</button>
        </div>
      </form>
    </dialog>

    <div class="settings" id="settings" hidden>
      <nav class="set-nav" aria-label="Settings">
        <h2>Settings</h2>
        <button type="button" data-set-pane="appearance">
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
            />
          </svg>
          Appearance
        </button>
        <button type="button" data-set-pane="shortcuts">
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="2" y="6" width="20" height="12" rx="2" />
            <path d="M6 10h.01M10 10h4M16 10h.01M8 14h8" />
          </svg>
          Shortcuts
        </button>
        <button type="button" data-set-pane="storage">
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <ellipse cx="12" cy="6" rx="8" ry="3" />
            <path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6" />
            <path d="M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6" />
          </svg>
          Storage
        </button>
        <button type="button" data-set-pane="about">
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="16" x2="12" y2="12" />
            <line x1="12" y1="8" x2="12.01" y2="8" />
          </svg>
          About
        </button>
      </nav>
      <section class="set-pane">
        <div class="set-head">
          <h2 id="settingsTitle">Appearance</h2>
          <button
            class="icon-btn"
            id="settingsClose"
            title="Close (Esc)"
            aria-label="Close settings"
          >
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
        <div class="set-body" id="settingsBody"></div>
      </section>
    </div>

    <script src="key-combo.js"></script>
    <script src="manager-renderer.js"></script>
  </body>
</html>
